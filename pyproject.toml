[project]
name = "agentos"
version = "1.0.0"
description = "AgentOS: a production API for agents."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os,mcp,slack,pgvector,psycopg]==2.8.4",
  "openai",
  "parallel-web",
  "python-dotenv",
]

[project.optional-dependencies]
# Pinned on purpose. CI runs `uv run ruff`, which fetches the newest release, so
# an unpinned linter turns someone else's release into a red build on a branch
# that did not change. ruff 0.16 both started formatting Python inside Markdown
# and widened its default rule set to flag the fail-soft `except Exception`
# handlers in app/schedules.py and workflows/deployment_check.py that this
# template documents and wants. Bump deliberately, not by accident.
dev = ["mypy>=1.18,<2", "ruff>=0.15,<0.16"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "workflows*"]
namespaces = false

[tool.ruff]
line-length = 120
# Markdown is excluded deliberately. ruff 0.16 began formatting Python code
# blocks inside .md, which reformats the illustrative snippets in AGENTS.md and
# README.md — prose examples, not source. Without this, `ruff format --check`
# passes or fails depending on which ruff version the runner happens to fetch.
exclude = [".venv*", "*.md"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]
