[project]
name = "agentos"
version = "1.0.0"
description = "Talent Search Assistant: evidence-based candidate search with Agno."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os,mcp,slack,pgvector,psycopg]==2.8.5",
  "composio==0.18.1",
  "google-genai",
  "google-search-results",
  "httpx",
  "openai",
  "openpyxl",
  "pydantic-settings",
  "pymupdf",
  "python-docx",
  "python-dotenv",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-asyncio", "ruff", "types-openpyxl"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
asyncio_mode = "auto"
markers = ["e2e: calls the configured model, Composio, Google Drive, Sheets, and Gemini"]
testpaths = ["tests"]
