[project]
name = "agentos"
version = "1.0.0"
description = "AgentOS: a production API for agents."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os,mcp,slack,pgvector,psycopg]==2.8.4",
  "openai",
  "parallel-web",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "workflows*"]
namespaces = false

[tool.ruff]
line-length = 120
# Markdown is excluded deliberately: ruff 0.16 began formatting Python code
# blocks inside .md, which rewrites the illustrative snippets in AGENTS.md and
# README.md — prose examples, not source.
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
# Declared, not inherited. ruff's *default* selection went from 122 rules to 830
# in 0.16, so a repo that relies on the default gets a different linter with
# every release — CI fetches the newest ruff, and a branch that changed nothing
# goes red. Naming the families pins the behaviour without pinning the tool.
#   E, F  — what this template has always enforced
#   I     — import order, already applied by scripts/format.sh
#   UP    — a public template should show current idiom
# Not selected: BLE (blind-except), because app/schedules.py and
# workflows/deployment_check.py catch broadly on purpose — a bad schedule logs a
# warning instead of crashing startup, which AGENTS.md documents as the design.
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]
