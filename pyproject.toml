[project]
name = "agentos"
version = "1.0.0"
description = "AgentOS: a production API for agents."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  # TEMP: agno 2.8.4 pre-release from the entity-memory-revamp branch (exact SHA).
  # Swap back to "agno[os,mcp,slack,pgvector,psycopg]==2.8.4" when it lands on PyPI.
  "agno[os,mcp,slack,pgvector,psycopg] @ https://github.com/agno-agi/agno/archive/418adcae43734275a9b888cbac8ba6a279656814.tar.gz#subdirectory=libs/agno",
  "openai",
  "parallel-web",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "workflows*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]
